# Push a tag like v0.2.0 to build Windows, macOS and Linux installers and attach them to a GitHub release.
# Installed copies then find the update through latest.yml / latest-mac.yml / latest-linux.yml (auto-update).
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Qubase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Qubase/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Code signing is optional: add CSC_LINK / CSC_KEY_PASSWORD (and Apple notarisation secrets) as repository secrets to sign.
      - run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
