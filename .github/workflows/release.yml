# Push a tag like v0.2.0 to build Windows, macOS and Linux installers and attach them to a GitHub release.
# Installed copies then find the update through latest.yml / latest-mac.yml / latest-linux.yml (auto-update).
name: Release
on:
  push:
    tags: ['v*']
  # Re-run one platform for the version in package.json (e.g. after a failed build), uploading to its release
  workflow_dispatch:
    inputs:
      platform:
        description: Which installers to build
        type: choice
        options: [all, windows, macos, linux]
        default: all

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            target: --win --x64
          - os: macos-latest
            name: macos
            target: --mac
          - os: ubuntu-latest
            name: linux
            target: --linux
    runs-on: ${{ matrix.os }}
    env:
      BUILD_THIS: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == matrix.name }}
    defaults:
      run:
        working-directory: Qubase
    steps:
      - if: env.BUILD_THIS == 'true'
        uses: actions/checkout@v4
      - if: env.BUILD_THIS == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Qubase/package-lock.json
      - if: env.BUILD_THIS == 'true'
        run: npm ci
      - if: env.BUILD_THIS == 'true'
        run: npm test
      - if: env.BUILD_THIS == 'true'
        run: npm run build
      # Code signing is optional: add CSC_LINK / CSC_KEY_PASSWORD (and Apple notarisation secrets) as repository secrets to sign.
      # An empty CSC_LINK is read as a file path (and fails on macOS), so it is only set when the secret exists
      - if: env.BUILD_THIS == 'true'
        shell: bash
        run: |
          if [ -z "$SIGN_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; else export CSC_LINK="$SIGN_LINK" CSC_KEY_PASSWORD="$SIGN_PASSWORD"; fi
          npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGN_LINK: ${{ secrets.CSC_LINK }}
          SIGN_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
